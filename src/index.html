<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>НАМУ</title>
    <link
      rel="stylesheet"
      href="./styles/main.scss"
    />
  </head>
  <body class="page__body">
    <header class="header">
      <div class="header__top">
        <div class="top-bar">
          <a
            href="#"
            class="top-bar__logo-link"
          >
            <img
              class="top-bar__logo"
              src="./images/icons/menu.svg"
              alt="Logo"
            />
          </a>
        </div>
        <div class="top-bar__left">
          <div
            class="top-bar__language"
            tabindex="0"
            aria-label="Change language"
          >
            <span id="lang-label">UA</span>
            <a
              href="#"
              class="icon icon--dropdown"
            ></a>
            <ul
              class="top-bar__language--options"
              id="lang-options"
            >
              <li data-leng="UA">UA</li>
              <li data-leng="EN">EN</li>
            </ul>
          </div>
          <div class="top-bar__icons">
            <a
              href="#menu"
              class="icon icon--menu"
            ></a>
          </div>
        </div>
      </div>
      <div class="header__content">
        <div class="header__content--text">
          <p class="text--additional">10 серпня - 10 листопада</p>
          <h1>Мистецтво XIX - XX ст.</h1>
          <p class="text--main">
            Внесок українських митців у світову культуру 19-20 ст.
          </p>
          <button class="button--primary">Купити квиток</button>
        </div>
        <img
          class="header__image"
          src="./images/header-img.png"
          alt="Header image"
        />
      </div>
    </header>

    <aside
      class="page__menu menu"
      id="menu"
    >
      <div class="top-bar menu__top">
        <a
          href="#"
          class="top-bar__logo-link"
        >
          <img
            src="./images/icons/menu.svg"
            alt="Logo"
            class="top-bar__logo"
          />
        </a>
        <div
          class="menu__language"
          tabindex="0"
          aria-label="Change language"
        >
          <span id="lang-label-menu">UA</span>
          <a
            href="#"
            class="icon icon--dropdown"
          ></a>
          <ul
            class="top-bar__language--options"
            id="lang-options-menu"
          >
            <li data-leng="UA">UA</li>
            <li data-leng="EN">EN</li>
          </ul>
        </div>
        <a
          href="#"
          class="icon icon--close"
        ></a>
      </div>
      <div class="menu__content">
        <div class="menu__content--options">
          <div class="menu__content--info">
            <p class="text--additional">Розклад сьогодні</p>
            <p class="text--main text--main__bold">12:00 - 19:00</p>
          </div>
          <div class="menu__content--info">
            <p class="text--additional">Адреса</p>
            <p class="text--main text--main__bold">
              Київ, вул. М. Грушевського, 6
            </p>
          </div>
          <nav class="nav menu__nav">
            <ul class="nav__list">
              <li class="nav__item">
                <a
                  href="#"
                  class="nav__link"
                >
                  Актуальні виставки
                </a>
              </li>
              <li class="nav__item">
                <a
                  href="#"
                  class="nav__link"
                >
                  Найближчі події
                </a>
              </li>
              <li class="nav__item">
                <a
                  href="#"
                  class="nav__link"
                >
                  Новини
                </a>
              </li>
            </ul>
          </nav>
          <br />
          <button class="button--primary">Купити квиток</button>
        </div>
        <div class="menu__content--image">
          <img
            src="./images/menu-img.png"
            alt="Menu image"
          />
        </div>
      </div>
    </aside>
    <script src="scripts/main.js"></script>
  </body>
</html>
